description: |
  《月迷津渡——古典诗词个案微观分析（修订版）》是福建师范大学孙绍振教授继《名作细读》之后的又一力作，针对近百篇经典诗词做微观分析，理论基础扎实，文本分析细致。本书将《美国"新批评"细读批判》作为"自序之一"收入，阐明作者的经典细读理论体系；同时特撰"古典诗歌宏观解读发微"一章，为建构中国式微观解读诗学提供学理基础。
